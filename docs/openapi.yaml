openapi: 3.1.0
info:
  title: SCP (School Class Progress) API
  version: "1.0.0"
  description: |
    Versioned JSON API for the native iOS client of SCP.
    All endpoints are prefixed with `/api/v1` and (except login) require a
    Sanctum Bearer token. Errors use a uniform envelope:
    `{ "message": string, "errors": {field: [msg]} | null }`.
servers:
  - url: http://localhost
    description: Local development
tags:
  - name: Auth
  - name: Config
  - name: Lookups
  - name: Dashboard
  - name: Schedules
  - name: Journals
  - name: Leave Requests
  - name: Attendance
  - name: Users
  - name: Classes
  - name: Exams
  - name: Room Schedules
  - name: Academic Calendar
  - name: Ineffective Days
  - name: Chat
  - name: System

security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue a Sanctum token
      security: []
      parameters:
        - $ref: '#/components/parameters/XThrottle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 100, default: ios }
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user (role, class, children for parents)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/profile:
    patch:
      tags: [Auth]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullname]
              properties:
                fullname: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/MustChangePassword' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (current_password required unless forced)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password, minLength: 6 }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/config:
    get:
      tags: [Config]
      summary: Global configuration and server time
      responses:
        '200':
          description: Config
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Config' }

  /api/v1/classes:
    get:
      tags: [Lookups]
      summary: List classes
      responses:
        '200':
          description: Classes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Class' }

  /api/v1/rooms:
    get:
      tags: [Lookups]
      summary: List rooms
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Room' }

  /api/v1/teachers:
    get:
      tags: [Lookups]
      summary: List teachers (Waka only)
      responses:
        '200':
          description: Teachers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Teacher' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Role-dependent dashboard payload
      description: |
        - role 2 (Guru): `today_schedules` (each with `journal_filled`), `late_journal_alerts`.
        - role 1 (Waka): `attendance_today`, `unfilled_journals`.
        - role 3 (Tim Kesiswaan): `pending_leave_count`.
        - role 4 (Siswa/Ortu): `student`, `month`, `summary`.
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }

  /api/v1/schedules:
    get:
      tags: [Schedules]
      summary: List schedules (roles 1, 2; Guru sees own only)
      parameters:
        - name: cycle
          in: query
          schema: { $ref: '#/components/schemas/CycleType' }
        - name: day
          in: query
          schema: { $ref: '#/components/schemas/DayOfWeek' }
        - name: teacher_id
          in: query
          schema: { type: integer }
        - name: class_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessList'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Schedule' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Schedules]
      summary: Create a schedule (Waka, or Guru for self)
      parameters:
        - $ref: '#/components/parameters/ScheduleLock'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Schedule' }
        '403': { $ref: '#/components/responses/ScheduleLockedOrForbidden' }
        '422': { $ref: '#/components/responses/ConflictOrValidation' }

  /api/v1/schedules/{schedule}:
    parameters:
      - name: schedule
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Schedules]
      summary: Update a schedule (owner teacher or Waka)
      parameters:
        - $ref: '#/components/parameters/ScheduleLock'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Schedule' }
        '403': { $ref: '#/components/responses/ScheduleLockedOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ConflictOrValidation' }
    delete:
      tags: [Schedules]
      summary: Delete a schedule
      parameters:
        - $ref: '#/components/parameters/ScheduleLock'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/ScheduleLockedOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/journals:
    get:
      tags: [Journals]
      summary: List journals (Guru own; Waka all; Tim Kesiswaan scoped by class)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated journals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JournalSummary' }
    post:
      tags: [Journals]
      summary: Create a journal and sync attendance (Guru, multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [schedule_id, date, topic_description, photo]
              properties:
                schedule_id: { type: integer }
                date: { type: string, format: date }
                topic_description: { type: string, maxLength: 5000 }
                photo: { type: string, format: binary }
                absent_students:
                  type: array
                  items: { $ref: '#/components/schemas/AbsentStudentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JournalSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/journals/prepare:
    get:
      tags: [Journals]
      summary: Roster for a schedule/date with approved-leave flags (Guru)
      parameters:
        - name: schedule_id
          in: query
          required: true
          schema: { type: integer }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          schedule: { $ref: '#/components/schemas/Schedule' }
                          date: { type: string, format: date }
                          students:
                            type: array
                            items: { $ref: '#/components/schemas/PrepareStudent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/journals/{journal}:
    parameters:
      - name: journal
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Journals]
      summary: Journal detail with attendances
      responses:
        '200':
          description: Journal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JournalDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/journals/{journal}/photo:
    parameters:
      - name: journal
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Journals]
      summary: Stream the private journal photo (inline)
      responses:
        '200':
          description: Image stream
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/journals/{journal}/attendances:
    parameters:
      - name: journal
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Journals]
      summary: Bulk update attendance by student_id (Guru owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendances]
              properties:
                attendances:
                  type: array
                  items: { $ref: '#/components/schemas/AttendanceUpdateInput' }
      responses:
        '200':
          description: Updated journal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JournalDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/leave-requests:
    get:
      tags: [Leave Requests]
      summary: List leave requests (Siswa/Ortu own, Tim Kesiswaan scoped, Waka all)
      parameters:
        - name: status_approval
          in: query
          schema: { $ref: '#/components/schemas/LeaveStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated leave requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveRequest' }
    post:
      tags: [Leave Requests]
      summary: Submit a leave request (role 4, multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [student_id, start_date, end_date, reason]
              properties:
                student_id: { type: integer }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string, maxLength: 5000 }
                document: { type: string, format: binary, description: 'pdf, jpg, jpeg, png (max 2MB)' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/leave-requests/{leaveRequest}:
    parameters:
      - name: leaveRequest
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Leave Requests]
      summary: Leave request detail
      responses:
        '200':
          description: Leave request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/leave-requests/{leaveRequest}/document:
    parameters:
      - name: leaveRequest
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Leave Requests]
      summary: Stream the private leave document (inline)
      responses:
        '200':
          description: Document stream
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/leave-requests/{leaveRequest}/status:
    parameters:
      - name: leaveRequest
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Leave Requests]
      summary: Approve or reject (roles 1, 3 scoped). Does NOT write attendance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_approval]
              properties:
                status_approval: { type: string, enum: [Approved, Rejected] }
      responses:
        '200':
          description: Updated leave request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeaveRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/attendance:
    get:
      tags: [Attendance]
      summary: Attendance recap for a student or one of a parent's children (role 4)
      parameters:
        - name: student_id
          in: query
          schema: { type: integer }
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Recap
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AttendanceRecap' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/system/cycle:
    patch:
      tags: [System]
      summary: Set the active cycle explicitly (Waka only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active_cycle]
              properties:
                active_cycle: { $ref: '#/components/schemas/CycleType' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          active_cycle: { $ref: '#/components/schemas/CycleType' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/system/lock:
    patch:
      tags: [System]
      summary: Set the schedule lock explicitly (Waka only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_schedule_locked]
              properties:
                is_schedule_locked: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          is_schedule_locked: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/system/unfilled-journals:
    get:
      tags: [System]
      summary: Teachers with unfilled journals past end_time + 30 minutes (Waka only)
      responses:
        '200':
          description: Unfilled journals per teacher
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          teachers:
                            type: array
                            items:
                              type: object
                              properties:
                                teacher_id: { type: integer }
                                teacher: { type: [string, 'null'] }
                                schedules:
                                  type: array
                                  items: { $ref: '#/components/schemas/Schedule' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/v1/users:
    get:
      tags: [Users]
      summary: List users (Role 1 or Role 3 scoped to students)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: role_id
          in: query
          schema: { type: integer, enum: [1, 2, 3, 4] }
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create new user (Role 1 or Role 3 creating student)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/users/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Users]
      summary: Get user details
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessSingle'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Users]
      summary: Delete user
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/users/{user}/reset-password:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Users]
      summary: Reset user password to default
      responses:
        '200':
          description: Password reset succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          default_password: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/classes:
    get:
      tags: [Classes]
      summary: List school classes (scoped for Wali Kelas)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated classes list
