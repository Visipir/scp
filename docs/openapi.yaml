    post:
      tags: [Chat]
      summary: Send prompt to Gemini AI assistant (Throttled 10/min, 100/day)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatMessageInput' }
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reply: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: AI provider error or timeout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    Search:
      name: search
      in: query
      schema: { type: string }
    MonthQuery:
      name: month
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}$' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 15 }
    ScheduleLock:
      name: X-Schedule-Lock
      in: header
      required: false
      description: Informational; schedule lock is enforced server-side.
      schema: { type: string }
    XThrottle:
      name: X-Throttle
      in: header
      required: false
      description: Login is limited to 5 attempts per minute per username + IP.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { message: Unauthenticated., errors: null }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { message: "Akses ditolak.", errors: null }
    MustChangePassword:
      description: Password change required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { message: "Anda harus mengganti kata sandi terlebih dahulu.", errors: null, code: must_change_password }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { message: "Data tidak ditemukan.", errors: null }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { message: "Data yang diberikan tidak valid.", errors: { username: ["The username field is required."] } }
    ConflictOrValidation:
      description: Schedule conflict or validation error (field keys start_time / room_id / class_id)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { message: "Konflik jadwal: Guru sudah memiliki jadwal di waktu yang sama.", errors: { start_time: ["Konflik jadwal: Guru sudah memiliki jadwal di waktu yang sama."] } }
    ScheduleLockedOrForbidden:
      description: Schedule is locked (Waka only bypasses) or not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { message: "Jadwal sedang dikunci oleh Waka Kurikulum.", errors: null }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { message: "Terlalu banyak percobaan. Silakan coba lagi nanti.", errors: null }

  schemas:
    ErrorEnvelope:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: [object, 'null']
          additionalProperties:
            type: array
            items: { type: string }
        code:
          type: string
          description: Optional machine-readable code (e.g. must_change_password).

    Message:
      type: object
      properties:
        message: { type: string }
        errors: { type: [object, 'null'] }

    SuccessSingle:
      type: object
      properties:
        data: {}

    SuccessList:
      type: object
      properties:
        data:
          type: array
          items: {}

    Paginated:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    Role:
      type: integer
      enum: [1, 2, 3, 4]
      description: "1=Waka, 2=Guru, 3=Tim Kesiswaan/BK, 4=Siswa/Ortu"

    CycleType:
      type: string
      enum: ["Putaran 1", "Putaran 2"]

    DayOfWeek:
      type: string
      enum: [Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu]

    AttendanceStatus:
      type: string
      enum: [Hadir, Sakit, Izin, Alpa, Terlambat]

    LeaveStatus:
      type: string
      enum: [Pending, Approved, Rejected]

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        fullname: { type: string }
        role_id: { $ref: '#/components/schemas/Role' }
        role: { type: [string, 'null'] }
        class_id: { type: [integer, 'null'] }
        class: { type: [string, 'null'] }
        gender: { type: [string, 'null'] }
        attendance_number: { type: [integer, 'null'] }
        must_change_password: { type: boolean }
        children:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              fullname: { type: string }
              class_id: { type: [integer, 'null'] }
              class: { type: [string, 'null'] }

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string }
            must_change_password: { type: boolean }
            user: { $ref: '#/components/schemas/User' }

    Config:
      type: object
      properties:
        active_cycle: { $ref: '#/components/schemas/CycleType' }
        is_schedule_locked: { type: boolean }
        server_time: { type: string, format: date-time }
        today_kbm_suspended: { type: boolean }

    Class:
      type: object
      properties:
        id: { type: integer }
        class_name: { type: string }
        academic_year: { type: [string, 'null'] }
        grade_level: { type: [string, 'null'] }
        major: { type: [string, 'null'] }

    Room:
      type: object
      properties:
        id: { type: integer }
        room_name: { type: string }

    Teacher:
      type: object
      properties:
        id: { type: integer }
        fullname: { type: string }
        username: { type: string }

    Schedule:
      type: object
      properties:
        id: { type: integer }
        subject: { type: string }
        day_of_week: { $ref: '#/components/schemas/DayOfWeek' }
        start_time: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$' }
        end_time: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$' }
        cycle_type: { $ref: '#/components/schemas/CycleType' }
        start_period: { type: [integer, 'null'] }
        end_period: { type: [integer, 'null'] }
        period_label: { type: string }
        teacher:
          type: [object, 'null']
          properties:
            id: { type: integer }
            fullname: { type: string }
        class:
          type: [object, 'null']
          properties:
            id: { type: integer }
            class_name: { type: string }
        room:
          type: [object, 'null']
          properties:
            id: { type: integer }
            room_name: { type: string }
        journal_filled:
          type: boolean
          description: Only present on the Guru dashboard.

    ScheduleInput:
      type: object
      required: [class_id, subject, day_of_week, start_time, end_time, cycle_type]
      properties:
        class_id: { type: integer }
        room_id: { type: [integer, 'null'] }
        teacher_id: { type: integer, description: Waka only }
        subject: { type: string, maxLength: 100 }
        day_of_week: { $ref: '#/components/schemas/DayOfWeek' }
        start_period: { type: [integer, 'null'] }
        end_period: { type: [integer, 'null'] }
        start_time: { type: string, pattern: '^\d{2}:\d{2}$' }
